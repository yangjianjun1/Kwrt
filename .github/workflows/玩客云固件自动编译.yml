#=================================================
# OpenWrt AutoBuild for 玩客云 onecloud
# Description: 在线自动编译带 ksmbd 的 Kwrt 固件
# Lisence: MIT
#=================================================
name: 玩客云固件自动编译

on:
  # 手动触发（主要方式）
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH 连接调试（true/false）'
        required: false
        default: 'false'
  
  # 推送代码时自动触发（可选，不需要可以注释掉）
  # push:
  #   branches:
  #     - master

env:
  TZ: Asia/Shanghai
  TARGET: onecloud

jobs:
  build:
    runs-on: ubuntu-22.04
    
    name: 编译玩客云固件
    
    steps:
    - name: 检出代码
      uses: actions/checkout@main
      with:
          fetch-depth: 0

    - name: 加载配置
      run: |
        echo "TARGET=${{ env.TARGET }}"
        source "${{ github.workspace }}/devices/common/settings.ini"
        if [ -f "devices/${{ env.TARGET }}/settings.ini" ]; then
          source "${{ github.workspace }}/devices/${{ env.TARGET }}/settings.ini"
        fi
        echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
        echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV
        echo "CONFIG_FILE=${CONFIG_FILE}" >> $GITHUB_ENV
        echo "DIY_SH=${DIY_SH}" >> $GITHUB_ENV

    - name: 释放磁盘空间
      uses: coder-xiaomo/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 初始化编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
        gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
        python3-setuptools rsync swig unzip zlib1g-dev file wget dwarves \
        llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
        libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"

    - name: 获取当前日期
      id: date
      run: |
        echo "date=$(date +'%m.%d')" >> $GITHUB_ENV
        echo "date2=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

    - name: 克隆 OpenWrt 源码
      run: |
        git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt

    - name: 加载自定义配置
      run: |
        function git_clone_path() {
          trap 'rm -rf "$tmpdir"' EXIT
          branch="$1" rurl="$2" mv="$3"
          [[ "$mv" != "mv" ]] && shift 2 || shift 3
          rootdir="$PWD"
          tmpdir="$(mktemp -d)" || exit 1
          if [ ${#branch} -lt 10 ]; then
          git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          else
          git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
          cd "$tmpdir"
          git checkout $branch
          fi
          if [ "$?" != 0 ]; then
            echo "error on $rurl"
            exit 1
          fi
          git sparse-checkout init --cone
          git sparse-checkout set $@
          [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
          cd $rootdir
          }
        export -f git_clone_path
        mkdir -p openwrt
        cp -rf devices/common/. openwrt/
        cp -rf devices/${{ env.TARGET }}/. openwrt/
        cp -rf devices openwrt/
        cd openwrt
        
        # ====== 在这里添加你需要的插件 ======
        echo "添加 ksmbd 文件共享插件..."
        sed -i 's/PACKAGES="/PACKAGES="ksmbd-server luci-app-ksmbd luci-app-ttyd luci-app-diskman /' devices/${{ env.TARGET }}/diy.sh
        # ===================================
        
        chmod +x devices/common/${{ env.DIY_SH }}
        /bin/bash "devices/common/${{ env.DIY_SH }}"
        cp -f devices/common/${{ env.CONFIG_FILE }} .config
        if [ -f "devices/${{ env.TARGET }}/${{ env.CONFIG_FILE }}" ]; then
          echo >> .config
          cat devices/${{ env.TARGET }}/${{ env.CONFIG_FILE }} >> .config
        fi
        if [ -f "devices/${{ env.TARGET }}/${{ env.DIY_SH }}" ]; then
          chmod +x devices/${{ env.TARGET }}/${{ env.DIY_SH }}
          /bin/bash "devices/${{ env.TARGET }}/${{ env.DIY_SH }}"
        fi
        cp -Rf ./diy/* ./ || true

    - name: 应用补丁
      run: |
        cd openwrt
        cp -rn devices/common/patches devices/${{ env.TARGET }}/ 2>/dev/null || true
        find "devices/${{ env.TARGET }}/patches" -maxdepth 1 -type f -name '*.revert.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' -R --no-backup-if-mismatch -p1 -F 1 -i '%'" 2>/dev/null || true
        find "devices/${{ env.TARGET }}/patches" -maxdepth 1 -type f -name '*.patch' ! -name '*.revert.patch' ! -name '*.bin.patch' -print0 | sort -z | xargs -I % -t -0 -n 1 sh -c "patch -d './' --no-backup-if-mismatch -p1 -F 1 -i '%'"

    - name: 生成最终配置
      run: |
        cd openwrt
        make defconfig

    - name: SSH 连接调试
      uses: kiddin9/debugger-action@master
      if: github.event.inputs.ssh == 'true'

    - name: 开始编译固件
      id: compile
      run: |
        df -hT
        cd openwrt
        echo -e "$(($(nproc)+1)) 线程编译"
        make -j$(($(nproc)+1)) || { log=$(mktemp); make V=s &>$log; tail -100 $log; exit 1; }
        df -hT

    - name: 整理固件文件
      id: organize
      continue-on-error: true
      run: |
        cd openwrt/bin/targets/*/*/
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        ls -lh

    - name: 上传固件到 Artifacts
      uses: actions/upload-artifact@main
      with:
        name: Kwrt_玩客云_${{ env.date2 }}
        path: |
          ${{ env.FIRMWARE }}/*.img
          ${{ env.FIRMWARE }}/*.img.gz
          openwrt/.config

    - name: 编译完成通知
      run: |
        echo "🎉 玩客云固件编译完成！"
        echo "固件版本：Kwrt ${{ env.date }}"
        echo "编译日期：${{ env.date2 }}"
        echo "下载位置：Actions 页面 -> Artifacts"
